; PHP-Einstellungen für den Document-Root auf dem Prod-Webspace (vom Deploy als
; public_html/.user.ini installiert). Das Hosting hat kein mod_deflate, deshalb komprimiert PHP
; seine Antworten (HTML, JSON) selbst. Antworten mit Content-Length (Datei-Downloads) schließt PHP
; dabei automatisch aus. Änderungen wirken nach höchstens 5 Minuten (user_ini.cache_ttl).
zlib.output_compression = On
zlib.output_compression_level = 5
