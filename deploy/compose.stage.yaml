name: waldbad-home

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE_FILE: /run/secrets/db_name
      MARIADB_USER_FILE: /run/secrets/db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_name
      - db_user
      - db_password
      - db_root_password
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$$(cat /run/secrets/db_root_password) --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: waldbad-home:stage
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: https://waldbad-home-stage.tail183645.ts.net
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      RUN_MIGRATIONS: "1"
    secrets:
      - db_name
      - db_user
      - db_password
      - app_secret
      - membership_integration_token
    volumes:
      - media_data:/var/www/html/public/uploads/media
    ports:
      - "127.0.0.1:8083:80"
      - "192.168.178.119:8083:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/public/v1/navigation') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 512m
    networks:
      - internal
      - web

  worker:
    image: waldbad-home:stage
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M", "--no-interaction"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: https://waldbad-home-stage.tail183645.ts.net
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      RUN_MIGRATIONS: "0"
      DROP_TO_WWW_DATA: "1"
    secrets:
      - db_name
      - db_user
      - db_password
      - app_secret
      - membership_integration_token
    volumes:
      - media_data:/var/www/html/public/uploads/media
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - internal

  access_gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /run/secrets/stage_htpasswd /etc/nginx/stage_htpasswd && chmod 0444 /etc/nginx/stage_htpasswd && exec nginx -g 'daemon off;'"
    volumes:
      - ../docker/stage-access-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - stage_htpasswd
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response --spider http://127.0.0.1/ 2>&1 | grep -q 'HTTP/1.1 401'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    networks:
      - internal
      - web

secrets:
  db_name:
    file: /srv/webapps/waldbad-home/secrets/db_name
  db_user:
    file: /srv/webapps/waldbad-home/secrets/db_user
  db_password:
    file: /srv/webapps/waldbad-home/secrets/db_password
  db_root_password:
    file: /srv/webapps/waldbad-home/secrets/db_root_password
  app_secret:
    file: /srv/webapps/waldbad-home/secrets/app_secret
  membership_integration_token:
    file: /srv/webapps/waldbad-home/secrets/membership_integration_token
  stage_htpasswd:
    file: /srv/webapps/waldbad-home/secrets/stage_htpasswd

volumes:
  database_data:
  media_data:

networks:
  internal:
    internal: true
  web:
    external: true
