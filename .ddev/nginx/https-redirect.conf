# Pins the canonical scheme to https (see DEFAULT_URI in .ddev/config.yaml and the login-link
# mailer). Without this, http and https are both served directly, and a browser bouncing between
# them silently breaks admin CSRF validation: Symfony's CsrfTokenManager namespaces the stored
# token by Request::isSecure() (here driven by $fcgi_https, see fastcgi_param HTTPS below), so a
# token issued on one scheme never validates on the other.
#
# TLS itself terminates at ddev-router (traefik), not in this container — nginx's own $scheme is
# always "http" here, so the redirect has to key off the forwarded header instead.
if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
}
