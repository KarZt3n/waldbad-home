framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

        pools:
            # Fotoarchiv: wird bei jeder Änderung neu aufgebaut; die Lebensdauer begrenzt nur
            # Abweichungen durch direkte Datenbankänderungen (sonst `app:photo-albums:warm-cache`).
            cache.photo_albums:
                adapter: cache.app
                default_lifetime: 7776000
            # Seiten, Footer, Social Media und Logo für öffentliche Anfragen (siehe `ModelCacheInterface`):
            # die Manager invalidieren bei jeder Änderung; die Lebensdauer begrenzt nur Abweichungen
            # durch direkte Datenbankänderungen.
            cache.models:
                adapter: cache.app
                default_lifetime: 2592000

when@test:
    framework:
        cache:
            pools:
                # Tests setzen die Datenbank je Testfall neu auf; ein Dateicache würde Daten
                # aus vorherigen Tests liefern.
                cache.models:
                    adapter: cache.adapter.array
