framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'

when@prod:
    framework:
        mailer:
            # Der Bird-API-Key liegt im Secrets-Vault (config/secrets/prod) und ist zugleich das SMTP-Passwort.
            # Lehnt Bird den Versand ab, geht die Mail über MAILER_DSN (T-Online) raus.
            dsn: 'failover(smtps://bird:%env(urlencode:BIRD_API_KEY)%@eu1.smtp.bird.com:465 %env(MAILER_DSN)%)'
