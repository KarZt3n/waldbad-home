security:
    role_hierarchy:
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_ROLE_MANAGE
            - ROLE_SYSTEM_MANAGE
        ROLE_MODULE_PAGES_PUBLISHER: ROLE_MODULE_PAGES_EDITOR
        ROLE_MODULE_PAGES_MODERATOR: ROLE_MODULE_PAGES_EDITOR
        ROLE_MODULE_PAGES_EDITOR: ROLE_MODULE_PAGES_VIEWER
        ROLE_MODULE_ACTIVITIES_EDITOR: ROLE_MODULE_ACTIVITIES_VIEWER
        ROLE_MODULE_GUESTBOOK_EDITOR: ROLE_MODULE_GUESTBOOK_VIEWER
        ROLE_MODULE_CONTACT_REQUESTS_EDITOR: ROLE_MODULE_CONTACT_REQUESTS_VIEWER
        ROLE_MODULE_EVENT_HELPERS_EDITOR: ROLE_MODULE_EVENT_HELPERS_VIEWER
        ROLE_MODULE_MEMBERSHIP_APPLICATIONS_EDITOR: ROLE_MODULE_MEMBERSHIP_APPLICATIONS_VIEWER
        ROLE_MODULE_USER_MANAGEMENT_EDITOR: ROLE_MODULE_USER_MANAGEMENT_VIEWER

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        cms_users:
            id: App\UI\IdentityAccess\Security\AuthenticatedUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: cms_users
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\UI\IdentityAccess\Security\LoginSuccessHandler
                failure_handler: App\UI\IdentityAccess\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/admin, roles: ROLE_CMS }
        - { path: ^/admin, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
