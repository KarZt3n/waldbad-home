# CSS und JS werden beim `asset-map:compile` für Prod (GitHub-Deploy, Docker-Build) minifiziert;
# lokal bleiben die Dateien unverändert lesbar. Das Programm `minify` (tdewolff/minify) kommt per
# apt aus dem Build-System (deploy-prod.yaml, Dockerfile): Den eingebauten Download über die
# GitHub-API lehnt GitHub auf geteilten Runnern per Rate-Limit ab (403), der Build bricht dann ab.
when@prod:
    sensiolabs_minify:
        asset_mapper:
            types:
                css: true
                js: true
        minify:
            local_binary: auto
            download_binary: false
