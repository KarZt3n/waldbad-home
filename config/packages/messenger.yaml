framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            App\Logic\Event\HelpRequest\Event\EventHelpRequestBroadcastRequestedEvent: async
            App\Logic\IdentityAccess\LoginToken\Event\LoginRequestedEvent: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                sync: 'sync://'
            routing:
                # Authentifizierungs-Workflows lösen den festen Test-Token unmittelbar ein. Die
                # Produktivkonfiguration oben stellt LoginRequestedEvent weiterhin in `async` ein.
                App\Logic\IdentityAccess\LoginToken\Event\LoginRequestedEvent: sync
