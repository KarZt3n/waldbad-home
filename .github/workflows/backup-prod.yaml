name: Prod backup

# Nächtliche Komplettsicherung (Datenbank, Uploads, Konfiguration) auf dem Telekom-Webspace, siehe
# deploy/prod-backup-remote.sh. Der Webspace hat kein crontab, deshalb startet GitHub Actions den Lauf.
on:
  schedule:
    # 01:30 UTC = 02:30 MEZ / 03:30 MESZ. GitHub kann geplante Läufe um einige Minuten verzögern.
    - cron: '30 1 * * *'
  workflow_dispatch:

# Dieselbe Gruppe wie das Prod-Deployment: Sicherung und Deployment laufen nie gleichzeitig.
concurrency:
  group: waldbad-home-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup waldbad-home prod
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Eigenes Environment, das nur `main` nutzen darf: geplante Läufe starten immer auf `main`, und das
    # Environment „production“ ist dem Deploy von Tags vorbehalten.
    environment: production-backup
    env:
      PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
    steps:
      - name: SSH einrichten
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_USER" ]; then
            echo '::error::Variablen PROD_SSH_HOST und PROD_SSH_USER fehlen im Environment „production-backup“.'
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/prod_deploy
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/prod_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
              HostName $PROD_SSH_HOST
              User $PROD_SSH_USER
              IdentityFile ~/.ssh/prod_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              ServerAliveInterval 30
              ServerAliveCountMax 10
          EOF

      # Geplante Läufe starten immer auf main. Das Skript kommt deshalb nicht aus dem Checkout, sondern aus
      # dem aktiven Release auf dem Server — so läuft immer die Version des zuletzt deployten Tags.
      - name: Sicherung erstellen
        run: |
          ssh prod 'script="$HOME/waldbad-home/current/deploy/prod-backup-remote.sh"
            if [ ! -f "$script" ]; then
              echo "Das aktive Release enthält $script nicht – bitte zuerst einen aktuellen Tag deployen." >&2
              exit 1
            fi
            BACKUP_RETENTION_DAYS=90 bash "$script"'
