name: Prod Beiträge neu berechnen

# „Beiträge neu berechnen“ für das laufende Beitragsjahr auf dem Telekom-Webspace (Alter zum Stichtag
# 31.12., Familienrollen, Beitragssätze), siehe `app:membership:recalculate-contributions`. Der Webspace
# hat kein crontab, deshalb startet GitHub Actions den Lauf.
on:
  schedule:
    # Testphase: täglich 03:00 UTC (04:00 MEZ). Danach nur noch zum Jahreswechsel, durch die Zeile
    # darunter ersetzen. 03:00 UTC liegt in jeder Zeitzone des Servers sicher im neuen Jahr.
    - cron: '0 3 * * *'
    # - cron: '0 3 1 1 *'
  workflow_dispatch:

# Dieselbe Gruppe wie Deployment und Sicherung: Die Läufe kommen sich nie in die Quere.
concurrency:
  group: waldbad-home-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recalculate:
    name: Beiträge neu berechnen (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Wie die nächtliche Sicherung: geplante Läufe starten immer auf `main`, das Environment
    # „production“ ist dem Deploy von Tags vorbehalten.
    environment: production-backup
    env:
      PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
    steps:
      - name: SSH einrichten
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_USER" ]; then
            echo '::error::Variablen PROD_SSH_HOST und PROD_SSH_USER fehlen im Environment „production-backup“.'
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/prod_deploy
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/prod_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
              HostName $PROD_SSH_HOST
              User $PROD_SSH_USER
              IdentityFile ~/.ssh/prod_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              ServerAliveInterval 30
              ServerAliveCountMax 10
          EOF

      # Läuft im aktiven Release auf dem Server, also mit dem Code des zuletzt deployten Tags. Scheitert,
      # wenn ein Mitglied nicht berechnet werden kann (die Ausgabe nennt die Mitgliedsnummern).
      - name: Beiträge neu berechnen
        run: |
          ssh prod 'cd "$HOME/waldbad-home/current" || exit 1
            if ! php8.4 bin/console list app:membership --raw | grep -q "^app:membership:recalculate-contributions "; then
              echo "Das aktive Release enthält app:membership:recalculate-contributions nicht – bitte zuerst einen aktuellen Tag deployen." >&2
              exit 1
            fi
            php8.4 bin/console app:membership:recalculate-contributions --no-interaction'
